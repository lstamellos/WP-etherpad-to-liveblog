name: PHP syntax and smoke tests
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      - name: GitHub updater smoke tests
        run: php tests/updater-smoke.php
      - name: Etherpad / Liveblog integration smoke tests
        run: php tests/integration-smoke.php
      - name: Greek/Latin control markers and NOPOST tests
        run: php tests/marker-keyboards-smoke.php
      - name: Reject missing legacy Etherpad origin\n        run: php tests/legacy-origin-smoke.php\n      - name: WordPress admin connection regression tests
        run: php tests/admin-ajax-smoke.php
      - name: Public Etherpad export smoke tests
        run: php tests/public-export-smoke.php
      - name: Liveblog poll trigger smoke tests
        run: php tests/liveblog-poll-trigger-smoke.php
      - name: Signed Etherpad webhook receiver smoke tests
        run: php tests/webhook-receiver-smoke.php
      - name: WordPress admin JavaScript syntax
        run: node --check assets/admin.js
